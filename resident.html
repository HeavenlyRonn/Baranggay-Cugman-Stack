<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resident Portal Login | Barangay Cugman System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    :root {
        --main-bg: #e8fafd;
        --navbar-bg: #2c3e50e0;
        --primary: #319795;
        --accent: #ffd166;
        --danger: #de425b;
        --panel-bg: #b2bec3e6;
        --footer-bg: #232942;
        --radius: 1.2rem;
        --shadow: 0 2px 20px rgba(60,140,150,0.12);
    }
    body {
        font-family: Arial, sans-serif;
        background: var(--main-bg) url('test.jpeg') no-repeat center center fixed;
        background-size: cover;
        color: #23576d;
        min-height: 100vh;
        box-sizing: border-box;
    }
    nav {
        position: fixed;
        top: 0;
        width: 100%;
        background: var(--navbar-bg);
        padding: 16px 0;
        z-index: 1000;
        box-shadow: 0 2px 8px rgba(44,62,80,0.12);
        border-radius: 0 0 var(--radius) var(--radius);
        backdrop-filter: blur(9px);
    }
    nav ul {
        display: flex;
        justify-content: flex-end;
        list-style: none;
        padding-right: 40px;
    }
    nav ul li {
        margin: 0 20px;
    }
    nav ul li a {
        color: #fff;
        text-decoration: none;
        font-size: 18px;
        font-weight: 500;
        padding: 8px 16px;
        border-radius: 7px;
        transition: background 0.2s, color 0.2s;
    }
    nav ul li a:hover, nav ul li a.active {
        color: #232942;
        background: var(--accent);
    }
    nav ul li.hide { display: none; }
    .container {
        margin-top: 120px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .login-panel {
        background: var(--panel-bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        max-width: 410px;
        width: 100%;
        padding: 38px 32px 28px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    h2 {
        color: #319795;
        margin-bottom: 16px;
        text-align: center;
    }
    form {
        display: flex;
        flex-direction: column;
        min-width: 180px;
        gap: 15px;
        width: 100%;
        align-items: center;
    }
    input {
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
        width: 92%;
        max-width: 270px;
    }
    button {
        background: #319795;
        color: white;
        border: none;
        padding: 11px;
        border-radius: 6px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        margin-top: 9px;
        width: 99%;
        transition: background 0.18s;
    }
    button:hover {
        background: #25646d;
    }
    .credentials {
        margin-top: 18px;
        background: #fcfcffc4;
        padding: 12px 10px 7px 10px;
        border-radius: 13px;
        box-shadow: 0 1px 5px #17202a21;
        font-size: .97em;
        width: 94%;
        text-align: center;
    }
    .credentials strong { color: #116067; }
    @media (max-width: 600px) {
        .login-panel { padding: 14px 2vw; }
        .container { margin-top: 95px; }
    }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#" id="resident-link" class="active">Resident Portal</a></li>
            <li><a href="admin.html" id="admin-link">Admin Panel</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#contact">Contacts</a></li>
        </ul>
    </nav>
    <div class="container">
        <div class="login-panel">
            <h2>Resident Login</h2>
            <form>
                <input type="text" placeholder="Username" autocomplete="off">
                <input type="password" placeholder="Password" autocomplete="off">
                <button type="submit" formaction="resident-dashboard.html">Login</button>
            </form>
            <div class="credentials">
                <div><b>Resident credentials (Demo):</b></div>
                <div>Username: <strong>resident</strong></div>
                <div>Password: <strong>res123</strong></div>
            </div>
        </div>
    </div>
</body>
</html>
